<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web Portal</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f0f2f5; }
        .button { display: inline-block; padding: 15px 30px; margin: 10px; font size: 18px; color: white; text-decoration: none; border-radius: 8px; width: 200px; text-align: center; }
        .tiktok { background-color: #000000; }
        .snapchat { background-color: #FFFC00; color: black; }
    </style>
</head>
<body>
    <h1>Personal Quick Links</h1>
    <a href="https://www.tiktok.com" class="button tiktok">TikTok Web</a>
    <a href="https://snapchat.com" class="button snapchat">Snapchat Web</a>
</body>
<div class="hub-container">
  <h2>Select Your Service</h2>
  <div class="grid">
    <!-- YouTube -->
    <a href="https://www.youtube.com" class="card">
      <img src="yt-logo.png" alt="YouTube">
      <span>YouTube</span>
    </a>
    <!-- YT Music -->
    <a href="https://music.youtube.com" class="card">
      <img src="ytm-logo.png" alt="YT Music">
      <span>Music</span>
    </a>
    <!-- YT TV -->
    <a href="https://tv.youtube.com" class="card">
      <img src="yttv-logo.png" alt="YT TV">
      <span>TV</span>
    </a>
  </div>
</div> 
<div class="game-card">
  <a href="https://1v1.lol">
    <img src="1v1-icon.png" alt="1v1.lol">
    <h3>1v1.lol</h3>
  </a>
</div>
